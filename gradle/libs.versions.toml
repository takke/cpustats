[versions]
kotlin = "2.4.0"
agp = "9.2.1"
# AndroidX Annotation
annotation = "1.10.0"
# AndroidX AppCompat
appcompat = "1.7.1"
# AssertJ
assertjCore = "3.27.7"
# AndroidX Activity(activity-compose を含む)
activity = "1.11.0"
# Compose BOM(BOM が Compose UI/Foundation/Material3 のバージョンを揃える)
composeBom = "2025.10.00"
# ConstraintLayout
constraintlayout = "2.2.1"
# AndroidX Core
core-ktx = "1.19.0"
# AndroidX Glance(AppWidget for Compose)
glance = "1.1.1"
# AndroidX Lifecycle(runtime-compose / viewmodel-compose)
lifecycle = "2.9.4"
# Preference-ktx
preference-ktx = "1.2.1"
# JUnit
junit = "4.13.2"
# Kotlinx Coroutines
kotlinxCoroutines = "1.10.2"
# Robolectric
robolectricVersion = "4.16.1"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference-ktx" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertjCore" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectricVersion" }

[plugins]
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
